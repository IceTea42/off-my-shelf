# Run on every commit: uv run pre-commit install
# Run on everything:  uv run pre-commit run --all-files
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]          # raw footage and big assets stay out of git
      - id: check-case-conflict       # names that clash on case-insensitive Windows
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks                  # blocks API keys and tokens before they reach the repo

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock                   # uv.lock stays in sync with pyproject.toml

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
