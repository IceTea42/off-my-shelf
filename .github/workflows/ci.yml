name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # "Run workflow" on main also publishes the Space (see docs/deploy.md)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t off-my-shelf .
      - name: Serve and answer
        run: |
          docker run -d --name oms -p 7860:7860 off-my-shelf
          for i in $(seq 1 30); do curl -sf localhost:7860/api/config && exit 0; sleep 1; done
          docker logs oms; exit 1

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: deploy Hugging Face Space
    needs: [checks, docker, secrets]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}  # optional: without it the job does nothing
    steps:
      - uses: actions/checkout@v7
        if: env.HF_TOKEN != ''
      - uses: astral-sh/setup-uv@v7
        if: env.HF_TOKEN != ''
      - name: Upload to icetea/off-my-shelf
        if: env.HF_TOKEN != ''
        run: |
          uv sync --locked
          uv run python scripts/deploy_space.py icetea/off-my-shelf
