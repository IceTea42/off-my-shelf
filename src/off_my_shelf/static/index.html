<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Off My Shelf</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" type="image/png">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1c1a; --muted:#6b675f; --line:#e4e0d6;
          --sell:#1f7a4d; --donate:#2f5fa7; --recycle:#8a5a12; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1100px; margin:auto; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.01em; }
  .lead { color:var(--muted); margin:0 0 20px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
         display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .drop { flex:1 1 280px; border:2px dashed var(--line); border-radius:12px; padding:18px;
          text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--ink); color:var(--ink); }
  select, button { font:inherit; padding:9px 12px; border-radius:10px; border:1px solid var(--line); }
  button { border:0; font-weight:600; cursor:pointer; background:var(--ink); color:#fff; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  #log { margin:16px 0; height:9.5em; overflow-y:auto; padding:8px 12px; border:1px solid var(--line);
         border-radius:10px; background:var(--card); font-size:14px; line-height:1.45; }
  #log .muted { color:var(--muted); }
  #log .warn { color:#8a5a00; }
  #log .error { color:#a12; }
  #log .agent { font-weight:600; }
  #log time { color:var(--muted); font-size:12px; margin-right:8px; font-variant-numeric:tabular-nums; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:8px 0; }
  #grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
          display:flex; flex-direction:column; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--line); }
  .photos.single { grid-template-columns:1fr; }
  figure { margin:0; position:relative; background:#fafafa; aspect-ratio:1; }
  figure img { width:100%; height:100%; object-fit:contain; display:block; }
  figcaption { position:absolute; left:8px; bottom:8px; font-size:11px; background:rgba(0,0,0,.6);
               color:#fff; padding:2px 6px; border-radius:6px; }
  .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  h2 { margin:0; font-size:16px; line-height:1.3; }
  .price { font-weight:700; font-size:18px; white-space:nowrap; }
  .muted { color:var(--muted); font-size:13px; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; color:#fff; }
  .sell { background:var(--sell); } .donate { background:var(--donate); }
  .recycle { background:var(--recycle); }
  .desc { white-space:pre-line; font-size:14px; }
  .agent { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
           margin:12px 0 16px; display:grid; gap:10px; }
  .agent textarea, .buyer textarea { width:100%; font:inherit; padding:10px; border-radius:10px;
           border:1px solid var(--line); resize:vertical; }
  .agent .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .agent ul { margin:0; padding-left:20px; }
  button.rec { background:#a12; }
  .reply { border-left:3px solid var(--line); padding:4px 10px; font-size:14px; }
  .reply.ok { border-color:var(--sell); }
  .buyer { display:grid; gap:6px; }
  .langs { display:flex; gap:6px; }
  #sources { display:flex; gap:12px; overflow-x:auto; margin:0 0 16px; }
  .source { position:relative; flex:0 0 auto; max-width:100%; aspect-ratio:auto; background:none; }
  .source img { display:block; max-height:360px; max-width:100%; width:auto; height:auto;
                border-radius:12px; }
  .source .box { position:absolute; border:2px solid #fff; border-radius:6px;
                 box-shadow:0 0 0 1px rgba(0,0,0,.4); color:#fff; font:700 13px/1 system-ui;
                 text-decoration:none; padding:2px 4px; text-shadow:0 1px 2px #000; }
  #grid.running .actions, #grid.running .langs, #grid.running .buyer { display:none; }
  #grid.running .card { animation: arrive .4s ease-out; }
  @keyframes arrive { from { opacity:0; transform:translateY(8px); } }
  .ad video { width:100%; max-height:480px; background:#000; border-radius:10px; display:block; }
  .card .actions { flex-wrap:wrap; }
  .chip { min-height:32px; padding:4px 10px; font-size:12px; background:transparent; color:var(--muted);
          border:1px solid var(--line); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .lot .strip { display:flex; gap:2px; background:var(--line); height:120px; }
  .lot .strip img { flex:1; min-width:0; object-fit:cover; background:#fafafa; }
  .capture { display:none; gap:8px; flex:1 1 100%; }
  .pick { flex:1; display:flex; align-items:center; justify-content:center; font-weight:600;
          border-radius:10px; background:var(--sell); color:#fff; cursor:pointer; }
  .card .actions { display:flex; gap:8px; margin-top:auto; }
  .card .actions button { flex:1; }
  button, select, .pick { min-height:44px; }
  @media (pointer: coarse) { .capture { display:flex; } }
  @media (max-width: 600px) {
    .wrap { padding:16px 12px calc(16px + env(safe-area-inset-bottom)); }
    h1 { font-size:24px; }
    form > * { flex:1 1 100%; }
    #grid { grid-template-columns:1fr; }
    .bar { flex-wrap:wrap; }
    .bar a, .bar button { width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Off My Shelf</h1>
  <p class="lead">Photograph or film the things you no longer use. Get ready-to-post listings,
    sorted into sell, donate and recycle.</p>

  <form id="form">
    <div class="capture">
      <label class="pick"><input id="snap" type="file" accept="image/*" capture="environment" hidden>Take a photo</label>
      <label class="pick"><input id="film" type="file" accept="video/*" capture="environment" hidden>Film the shelf</label>
    </div>
    <label class="drop" id="drop">
      <input id="files" type="file" multiple accept="image/*,video/*,.heic,.heif,.avif,.jxl,.mkv,.mts,.m2ts" hidden>
      <span id="drop-text">Drop photos or videos here, or click to choose</span>
    </label>
    <select id="language" aria-label="Listing language"></select>
    <label class="muted"><input id="shots" type="checkbox" checked> AI-complete hidden parts</label>
    <button id="start" type="submit" disabled>Create listings</button>
    <button id="demo" class="ghost" type="button">Try the demo</button>
  </form>

  <div id="log" role="log" aria-live="polite" hidden></div>
  <div class="bar" id="bar" hidden>
    <strong id="summary"></strong>
    <a id="zip"><button type="button">Download listing pack</button></a>
  </div>
  <section class="agent" id="agent" hidden>
    <strong>Tell the agent what you need</strong>
    <textarea id="goal" rows="2" placeholder="e.g. I'm moving on Friday: sell the electronics fast and donate the books"></textarea>
    <div class="actions">
      <button id="run-agent" type="button">Run agent</button>
      <button id="mic" class="ghost" type="button">Speak instead</button>
    </div>
  </section>
  <div id="sources" hidden></div>
  <div id="grid"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LANG_NAMES = { en: "English", fr: "Français", tr: "Türkçe" };
let chosen = [];
let current = null;

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// One scrollable activity log: run progress, warnings, voice and agent replies all stay readable.
const MAX_LOG_LINES = 500;
function log(text, kind = "") {
  const box = $("log");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  const stamp = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const line = el("div", { className: kind }, [el("time", { textContent: stamp }), el("span", { textContent: text })]);
  box.append(line);
  while (box.childElementCount > MAX_LOG_LINES) box.firstElementChild.remove();
  box.hidden = false;
  if (atBottom) box.scrollTop = box.scrollHeight; // keep following unless the reader scrolled up
  return line.lastElementChild; // a live line (e.g. a recording timer) can update its text
}

// Hand a pack file (photo or video ad) to another app; without a share sheet, download it.
async function shareFile(url, filename, title, text) {
  const blob = await (await fetch(url)).blob();
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare?.({ files: [file] })) return navigator.share({ title, text, files: [file] });
  if (navigator.share) return navigator.share({ title, text });
  el("a", { href: url, download: filename }).click();
}

function choose(files, add = false) {
  chosen = add ? [...chosen, ...files] : [...files];
  $("drop-text").textContent = chosen.length
    ? `${chosen.length} file(s): ${chosen.map((f) => f.name).join(", ")}`
    : "Drop photos or videos here, or click to choose";
  $("start").disabled = chosen.length === 0;
}

function bundleCard(bundle, crops) {
  const copy = el("button", { type: "button", textContent: "Copy lot listing" });
  const text = `${bundle.title}\n\n${bundle.description}\n\n${Math.round(bundle.price)} ${bundle.currency}`;
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; }
    catch { copy.textContent = "Copy failed"; }
  });
  return el("article", { className: "card lot" }, [
    el("div", { className: "strip" }, bundle.item_ids.map((id) =>
      el("img", { src: crops[id], alt: id, loading: "lazy" }))),
    el("div", { className: "body" }, [
      el("div", { className: "row" }, [el("h2", { textContent: bundle.title }),
        el("span", { className: "badge sell", textContent: `lot of ${bundle.item_ids.length}` })]),
      el("span", { className: "price", textContent: `${Math.round(bundle.price)} ${bundle.currency}` }),
      el("div", { className: "desc", textContent: bundle.description }),
      el("div", { className: "muted", textContent: bundle.item_ids.join(", ") }),
      el("div", { className: "actions" }, [copy]),
    ]),
  ]);
}

function card(item, base) {
  const a = item.analysis;
  const money = (v) => `${Math.round(v)} ${a.price.currency}`;
  const photos = [el("figure", {}, [el("img", { src: base + item.detection.crop_path,
    alt: a.listing.title, loading: "lazy" }), el("figcaption", { textContent: "Original photo" })])];
  if (item.product_shots.length) {
    photos.push(el("figure", {}, [el("img", { src: base + item.product_shots[0],
      alt: "Product shot", loading: "lazy" }),
      el("figcaption", { textContent: item.product_shots[0].endsWith("-completed.jpg")
        ? "Hidden parts AI-completed" : "Clean shot, real pixels" })]));
  }
  // The listing in each language made so far; the chips switch it or ask for a translation.
  const texts = Object.fromEntries([a.listing, ...item.translations].map((t) => [t.language, t]));
  let shown = a.listing.language;
  const title = el("h2", { textContent: a.listing.title });
  const desc = el("div", { className: "desc", textContent: a.listing.description });
  const textOf = () => `${texts[shown].title}\n\n${texts[shown].description}\n\n${money(a.price.suggested)}`;
  const langs = el("div", { className: "langs" }, Object.keys(LANG_NAMES).map((code) => {
    const chip = el("button", { type: "button", className: "chip" + (code === shown ? " on" : ""),
      textContent: code.toUpperCase(), title: LANG_NAMES[code] });
    chip.addEventListener("click", async () => {
      if (!texts[code]) {
        chip.textContent = "…";
        const body = new FormData();
        body.append("language", code);
        try {
          texts[code] = await postForm(`/api/runs/${current}/items/${item.item_id}/translate`, body);
          log(`${item.item_id}: listing translated to ${LANG_NAMES[code]}`);
        } catch (error) {
          log(`Translation failed: ${error.message}`, "error");
        }
        chip.textContent = code.toUpperCase();
        if (!texts[code]) return;
      }
      shown = code;
      title.textContent = texts[code].title;
      desc.textContent = texts[code].description;
      langs.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
    });
    return chip;
  }));
  const copy = el("button", { type: "button", textContent: "Copy listing" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(textOf()); copy.textContent = "Copied"; }
    catch { copy.textContent = "Copy failed"; }
    setTimeout(() => (copy.textContent = "Copy listing"), 1500);
  });
  const actions = [copy];
  if (navigator.share) { // phones: hand the listing and its photo to a marketplace or chat app
    const share = el("button", { type: "button", className: "ghost", textContent: "Share" });
    share.addEventListener("click", () => shareFile(base + (item.product_shots[0] ||
      item.detection.crop_path), `${item.item_id}.jpg`, texts[shown].title, textOf()).catch(() => {}));
    actions.push(share);
  }
  const ad = el("div", { className: "ad" });
  const showAd = () => ad.replaceChildren(el("video", { src: base + item.ad_video, controls: true,
    playsInline: true, preload: "metadata",
    poster: base + (item.product_shots[0] || item.detection.crop_path) }));
  if (item.ad_video) showAd();
  const adButton = el("button", { type: "button", className: "ghost",
    textContent: item.ad_video ? "Share video ad" : "Video ad" });
  adButton.addEventListener("click", async () => {
    adButton.disabled = true;
    try {
      if (item.ad_video) {
        await shareFile(base + item.ad_video, `${item.item_id}.mp4`, texts[shown].title, textOf());
      } else {
        log(`${item.item_id}: making a 10 s video ad from its real photo…`, "muted");
        item.ad_video = (await postForm(`/api/runs/${current}/items/${item.item_id}/ad`, new FormData())).video;
        showAd();
        adButton.textContent = "Share video ad";
        log(`${item.item_id}: video ad ready`);
      }
    } catch (error) {
      log(`Video ad failed: ${error.message}`, "error");
    } finally {
      adButton.disabled = false;
    }
  });
  actions.push(adButton);
  const defects = a.condition.defects.length ? ` · ${a.condition.defects.join(", ")}` : "";
  const mode = item.pricing_mode ? ` · ${item.pricing_mode.replace("_", " ")}` : "";
  const replies = item.buyer_replies.map((reply, index) => {
    const approve = el("button", { type: "button", className: "ghost",
      textContent: reply.approved ? "Approved: copy" : "Approve and copy" });
    approve.addEventListener("click", async () => {
      await fetch(`/api/runs/${current}/items/${item.item_id}/replies/${index}/approve`,
        { method: "POST" });
      try { await navigator.clipboard.writeText(reply.draft_reply); } catch {}
      approve.textContent = "Approved: copied";
    });
    return el("div", { className: "reply" + (reply.approved ? " ok" : "") }, [
      el("div", { className: "muted", textContent: `Buyer: ${reply.buyer_message}` }),
      el("div", { textContent: reply.draft_reply }), approve]);
  });
  const ask = el("textarea", { rows: 1, placeholder: "Paste a buyer's message…" });
  const draft = el("button", { type: "button", className: "ghost", textContent: "Draft a reply" });
  draft.addEventListener("click", () => ask.value.trim() &&
    callAgent({ buyer_item_id: item.item_id, buyer_message: ask.value.trim() }));
  return el("article", { className: "card", id: item.item_id }, [
    el("div", { className: "photos" + (photos.length === 1 ? " single" : "") }, photos),
    el("div", { className: "body" }, [
      el("div", { className: "row" }, [
        title,
        el("span", { className: `badge ${a.triage.decision}`, textContent: a.triage.decision }),
      ]),
      el("div", { className: "row" }, [
        el("span", { className: "price", textContent: money(a.price.suggested) }),
        el("span", { className: "muted", textContent: `${money(a.price.low)}–${money(a.price.high)}` }),
      ]),
      el("div", { className: "muted",
        textContent: `Condition: ${a.condition.grade.replace("_", " ")}${defects}` }),
      langs,
      desc,
      el("div", { className: "muted", textContent: a.triage.reason + mode }),
      ad,
      el("div", { className: "actions" }, actions),
      el("div", { className: "buyer" }, [...replies, ask, draft]),
    ]),
  ]);
}

function show(run) {
  current = run.run_id;
  $("agent").hidden = false;
  render(run.pack, run.base_url);
}

// The input photos (or video frames) with a numbered box per item: input -> output at a glance.
function renderSources(pack, base) {
  const media = pack.media || [...new Set(pack.items.map((i) => i.detection.source.media))];
  $("sources").hidden = media.length === 0;
  $("sources").replaceChildren(...media.map((path) => {
    const boxes = pack.items.filter((i) => i.detection.source.media === path).map((item) => {
      const b = item.detection.bbox;
      const box = el("a", { className: "box", href: `#${item.item_id}`,
        textContent: String(Number(item.item_id.split("-")[1])),
        title: item.analysis.listing.title });
      Object.assign(box.style, { left: `${b.x0 * 100}%`, top: `${b.y0 * 100}%`,
        width: `${(b.x1 - b.x0) * 100}%`, height: `${(b.y1 - b.y0) * 100}%` });
      return box;
    });
    return el("figure", { className: "source" }, [
      el("img", { src: base + path, alt: "Your photo", loading: "lazy" }), ...boxes]);
  }));
}

// While a run is going, cards show as soon as their listing is ready (actions come at the end).
function render(pack, base, running = false) {
  const items = pack.items;
  const selling = items.filter((i) => i.analysis.triage.decision === "sell");
  const value = selling.reduce((sum, i) => sum + i.analysis.price.suggested, 0);
  $("summary").textContent = `${items.length} items · ${selling.length} to sell, about ${Math.round(value)} €`;
  $("zip").href = `/api/runs/${current}/zip`;
  $("zip").hidden = running;
  $("bar").hidden = false;
  $("grid").classList.toggle("running", running);
  const crops = Object.fromEntries(items.map((i) => [i.item_id, base + i.detection.crop_path]));
  $("grid").replaceChildren(...(pack.bundles || []).map((b) => bundleCard(b, crops)),
    ...items.map((item) => card(item, base)));
  renderSources(pack, base);
  if (!items.length && !running) log("No items found: try a closer photo.", "warn");
}

async function follow(runId) {
  current = runId;
  for (let seen = 0, shown = ""; ;) {
    const response = await fetch(`/api/runs/${runId}?since=${seen}`);
    const run = await response.json();
    run.messages.forEach((m) => log(m, m.startsWith("warning:") ? "warn" : "muted"));
    seen = run.message_count;
    const partial = JSON.stringify((run.items || []).map((i) => [i.item_id, i.product_shots]));
    if (run.status === "running" && partial !== shown && run.items.length) {
      shown = partial;
      render({ items: run.items }, run.base_url, true);
    }
    if (run.status === "done") { document.title = "✓ Off My Shelf"; return show(run); }
    if (run.status === "error") { document.title = "⚠ Off My Shelf"; return log(run.error, "error"); }
    document.title = run.items_total
      ? `(${run.items_done}/${run.items_total}) Off My Shelf` : "… Off My Shelf";
    await new Promise((resolve) => setTimeout(resolve, 1000));
  }
}

async function start(event) {
  event.preventDefault();
  const body = new FormData();
  chosen.forEach((file) => body.append("files", file));
  body.append("language", $("language").value);
  body.append("product_shots", $("shots").checked);
  $("start").disabled = true;
  $("bar").hidden = true;
  $("grid").replaceChildren();
  log(`Uploading ${chosen.length} file(s)…`, "muted");
  $("log").scrollIntoView({ behavior: "smooth", block: "nearest" }); // on phones the form fills the screen
  try {
    const response = await fetch("/api/runs", { method: "POST", body });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || response.statusText);
    await follow(data.run_id);
  } catch (error) {
    log(String(error.message || error), "error");
  } finally {
    $("start").disabled = chosen.length === 0;
  }
}

async function postForm(url, body) {
  const response = await fetch(url, { method: "POST", body });
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { detail: text }; }
  if (!response.ok) {
    const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
    throw new Error(detail || `${response.status} ${response.statusText}`);
  }
  return data;
}

async function callAgent(fields) {
  const body = new FormData();
  Object.entries(fields).forEach(([key, value]) => body.append(key, value));
  log("The agent is working…", "muted");
  try {
    const data = await postForm(`/api/runs/${current}/agent`, body);
    data.actions.forEach((action) => log(`• ${action}`, action.includes("blocked by check") ? "warn" : ""));
    log(data.summary, "agent");
    render(data.pack, `/runs/${current}/pack/`);
  } catch (error) {
    log(`Agent failed: ${error.message}`, "error");
  }
}

// Microphone -> the browser's own recorder (WebM/Ogg/MP4) -> server decodes and transcribes ->
// goal box -> agent. No hand-made audio encoding in the page.
const MAX_RECORD_S = 60;
const AUDIO_EXT = { webm: "webm", ogg: "ogg", mp4: "m4a", mpeg: "mp3", wav: "wav" };
let recorder = null;

async function startMic() {
  if (!window.MediaRecorder) throw new Error("this browser cannot record audio; type the goal");
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const media = new MediaRecorder(stream);
  const chunks = [];
  const started = Date.now();
  media.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const stopped = new Promise((resolve) => (media.onstop = resolve));
  media.start(250);
  const live = log("Listening… say your goal, then press Stop", "muted");
  const tick = setInterval(() => {
    const seconds = Math.round((Date.now() - started) / 1000);
    live.textContent = `Listening… ${seconds} s (say your goal, then press Stop)`;
    if (seconds >= MAX_RECORD_S) stopMic().catch(showMicError);
  }, 500);
  recorder = { stream, media, chunks, stopped, tick };
  $("mic").textContent = "Stop and send"; $("mic").className = "rec";
}

async function stopMic() {
  if (!recorder) return;
  const { stream, media, chunks, stopped, tick } = recorder;
  recorder = null;
  clearInterval(tick);
  media.stop();
  await stopped;
  stream.getTracks().forEach((t) => t.stop());
  $("mic").textContent = "Speak instead"; $("mic").className = "ghost";
  const type = media.mimeType || chunks[0]?.type || "audio/webm";
  const blob = new Blob(chunks, { type });
  if (!blob.size) throw new Error("the microphone sent no audio: check the input device");
  const ext = AUDIO_EXT[type.split("/")[1]?.split(";")[0]] || "webm";
  log("Transcribing…", "muted");
  const body = new FormData();
  body.append("voice", blob, `goal.${ext}`);
  const { transcript } = await postForm("/api/transcribe", body);
  $("goal").value = transcript;
  log(`Heard: “${transcript}”`);
  return callAgent({ goal: transcript });
}

function showMicError(error) {
  if (recorder) { clearInterval(recorder.tick); recorder.stream.getTracks().forEach((t) => t.stop()); }
  recorder = null;
  $("mic").textContent = "Speak instead"; $("mic").className = "ghost";
  log(`Voice failed: ${error.message}`, "error");
}

async function init() {
  const config = await (await fetch("/api/config")).json();
  $("language").replaceChildren(...config.languages.map((code) =>
    el("option", { value: code, textContent: LANG_NAMES[code] || code,
      selected: code === config.default_language })));
  if (config.offline) log("Offline mode: no API key set. The demo and cached runs still work.", "warn");
  $("files").addEventListener("change", (e) => choose(e.target.files));
  ["snap", "film"].forEach((id) => $(id).addEventListener("change", (e) => {
    choose(e.target.files, true); // camera shots add up, one per tap
    e.target.value = "";
  }));
  const shared = new URLSearchParams(location.search).get("run"); // from the Android share sheet
  if (shared) { history.replaceState(null, "", "/"); follow(shared); }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  const drop = $("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("over"); choose(e.dataTransfer.files);
  });
  $("form").addEventListener("submit", start);
  $("run-agent").addEventListener("click", () => $("goal").value.trim() &&
    callAgent({ goal: $("goal").value.trim() }));
  $("mic").addEventListener("click", () => (recorder ? stopMic() : startMic()).catch(showMicError));
  $("demo").addEventListener("click", async () => {
    const response = await fetch("/api/demo", { method: "POST" });
    await follow((await response.json()).run_id);
  });
}
init();
</script>
